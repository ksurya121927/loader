
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Small Menu Loader</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #ffffff;
  font-family: Arial, sans-serif;
}

/* FULL SCREEN LOADER */
.menu-loader {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100dvh;
  background: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999999;
}

/* SMALL MENU WRAPPER */
.menu-wrapper {
  position: relative;
  width: 115px;
  height: 150px;
  transform: rotate(-12deg);
  flex-shrink: 0;
}

/* MENU CARD */
.restaurant-menu {
  position: absolute;
  inset: 0;
  background: #ffffff;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 5px 16px rgba(0,0,0,0.10);
}

/* ANIMATED PINK BORDER */
.menu-border {
  position: absolute;
  inset: -5px;
  width: calc(100% + 10px);
  height: calc(100% + 10px);
  overflow: visible;
  pointer-events: none;
  z-index: 5;
}

.menu-border rect {
  fill: none;
  stroke: #f52c9a;
  stroke-width: 5;
  stroke-linecap: round;
  stroke-dasharray: 65 285 65 285;
  animation: borderTravel 1s linear infinite;
}

/* FAST BORDER ANIMATION */
@keyframes borderTravel {
  from {
    stroke-dashoffset: 0;
  }
  to {
    stroke-dashoffset: -700;
  }
}

/* MENU HEADER */
.menu-header {
  height: 32px;
  background: #f2f2f2;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 2px;
}

.menu-header h3 {
  font-size: 9px;
  font-weight: 900;
  color: #111;
  letter-spacing: 0.2px;
}

.menu-header span {
  font-size: 5px;
  color: #777;
  letter-spacing: 1px;
}

/* MENU ITEMS */
.menu-item {
  height: 39px;
  padding: 3px 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #eeeeee;
}

.menu-item h4 {
  font-size: 6px;
  font-weight: 700;
  color: #222;
  margin-bottom: 4px;
}

.menu-line {
  width: 36px;
  height: 2px;
  background: #e5e5e5;
  border-radius: 4px;
  margin-bottom: 3px;
}

.menu-line.short {
  width: 22px;
}

/* FOOD IMAGES */
.menu-food {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
}

/* MOBILE RESPONSIVE */
@media (max-width: 480px) {
  .menu-wrapper {
    width: 115px;
    height: 150px;
  }
}

/* VERY SMALL SCREENS */
@media (max-width: 320px) {
  .menu-wrapper {
    transform: rotate(-12deg) scale(0.9);
  }
}

/* ACCESSIBILITY */
@media (prefers-reduced-motion: reduce) {
  .menu-border rect {
    animation: none;
  }
}
</style>
</head>

<body>

<div class="menu-loader" id="menuLoader">

  <div class="menu-wrapper">

    <!-- MENU CARD -->
    <div class="restaurant-menu">

      <!-- HEADER -->
      <div class="menu-header">
        <h3>RESTAURANT</h3>
        <span>MENU</span>
      </div>

      <!-- BREAKFAST -->
      <div class="menu-item">
        <div>
          <h4>Breakfast</h4>
          <div class="menu-line"></div>
          <div class="menu-line short"></div>
          <div class="menu-line"></div>
        </div>

        <img
          class="menu-food"
          src="https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=150"
          alt="Breakfast">
      </div>

      <!-- MAIN -->
      <div class="menu-item">
        <div>
          <h4>Main</h4>
          <div class="menu-line"></div>
          <div class="menu-line short"></div>
          <div class="menu-line"></div>
        </div>

        <img
          class="menu-food"
          src="https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=150"
          alt="Main course">
      </div>

      <!-- SALADS -->
      <div class="menu-item">
        <div>
          <h4>Salads</h4>
          <div class="menu-line"></div>
          <div class="menu-line short"></div>
          <div class="menu-line"></div>
        </div>

        <img
          class="menu-food"
          src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=150"
          alt="Salad">
      </div>

    </div>

    <!-- FAST MOVING PINK BORDER -->
    <svg
      class="menu-border"
      viewBox="0 0 125 160"
      preserveAspectRatio="none"
      aria-hidden="true">

      <rect
        x="3"
        y="3"
        width="119"
        height="154"
        rx="12"
        pathLength="700"
      />
    </svg>

  </div>

</div>

</body>
</html>
